name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-build-web-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and check formatting
        run: |
          dart analyze
          dart format --output=none --set-exit-if-changed .

      - name: Run tests
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          tar -czvf daftarche-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Build Web release
        run: flutter build web --release

      - name: Package Web build
        run: |
          tar -czvf daftarche-web.tar.gz -C build/web .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            daftarche-linux-x64.tar.gz
            daftarche-web.tar.gz

  publish-release:
    needs: verify-and-build-web-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Determine release tag
        id: tag_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_meta.outputs.TAG_NAME }}
          name: "Daftarche ${{ steps.tag_meta.outputs.TAG_NAME }}"
          generate_release_notes: true
          files: |
            ./artifacts/daftarche-linux-x64.tar.gz
            ./artifacts/daftarche-web.tar.gz