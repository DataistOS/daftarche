# General Section (Metadata)
name: daftarche
homepage: https://daftarche.dataist.ir/
description: "Daftarche: Unified Contact Hub"
issue_tracker: https://github.com/DataistOS/daftarche/issues
documentation: https://dpic.dataist.ir/heuristic/_source/category/tools/daftarche.html
publish_to: 'none'
version: 0.4.2+1

# Environment
environment:
  sdk: ^3.8.1

# Dependencies
dependencies:
  # Flutter SDK & Core UI
  flutter:
    sdk: flutter

  # Localization Support (RTL & Persian)
  flutter_localizations:
    sdk: flutter

  # Networking & Backend Client (UpUpa API & Direct HTTP Requests)
  upupa_dart:
    path: ../upupa/upupa_dart
  http: ^1.6.0

  # Icons & UX Enhancements
  cupertino_icons: ^1.0.8

  # QR Code & Digital Business Card Generation
  qr_flutter: ^4.1.0

  # Environment Variables Management (.env)
  flutter_dotenv: ^6.0.2

# Development Dependencies
dev_dependencies:
  # Flutter Testing Framework
  flutter_test:
    sdk: flutter

  # Official Flutter Linter & Code Style Guidelines
  flutter_lints: ^5.0.0

# Flutter specific configurations
flutter:
  # Enable Material Design components
  uses-material-design: true

  # Assets & Resources
  assets:
    - .env

  # Custom Fonts (Vazirmatn for Persian typography)
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf